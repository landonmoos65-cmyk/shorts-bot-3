name: Jynxzi Short

on:
  schedule:  # 2 Shorts a day, about 4 PM and 10 PM US Eastern. Odd minutes on purpose: GitHub
             # delays or drops scheduled runs at busy times like the top of the hour.
    - cron: "41 20 * * *"
    - cron: "41 2 * * *"
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:  # never run two at once (they'd fight over history.json)
  group: jynxzi-bot
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip                      # faster installs
      - uses: actions/cache@v4            # keep the Whisper model between runs (saves ~1 min + a download)
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: pip install -U -r requirements.txt   # -U: always newest yt-dlp (Twitch/Kick changes)
      - name: Make and post the Short (up to 3 tries)
        run: |
          for i in 1 2 3; do
            echo "================ Attempt $i of 3 ================"
            rm -rf work
            if python jynxzi.py; then echo "Posted on attempt $i"; exit 0; fi
            if [ $i -lt 3 ]; then echo "Attempt $i didn't post - waiting 8 min, then trying fresh clips"; sleep 480; fi
          done
          echo "All 3 attempts failed - check the log above"
          exit 1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          WATERMARK: ${{ vars.WATERMARK }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: video
          path: work/final.mp4
          if-no-files-found: ignore
      - name: Save history
        if: always()
        run: |
          git config user.name "jynxzi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json || exit 0
          git commit -m "history: $(date -u +%F)" || exit 0
          git pull --rebase -X theirs || true
          git push
